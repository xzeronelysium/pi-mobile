name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime tests and bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime dependencies
        working-directory: runtime
        run: npm ci
      - name: Test runtime
        working-directory: runtime
        run: npm test
      - name: Build runtime bundle
        working-directory: runtime
        run: npm run build
      - name: Verify generated bundle is current
        run: git diff --exit-code -- app/src/main/assets/native-runtime/runtime.js

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install runtime dependencies and build bundle
        working-directory: runtime
        run: npm ci && npm run build
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
